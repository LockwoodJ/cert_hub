  <text x="504" y="345" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="600" fill="#ffffff" opacity="0.86">Training Reference</text>
  <text x="504" y="405" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#ffffff" opacity="0.78">Focus • power • speed</text>
