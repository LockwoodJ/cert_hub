      <stop stop-color="#b45309" offset="0"/>
      <stop stop-color="#001d66" offset="1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-opacity="0.22"/>
